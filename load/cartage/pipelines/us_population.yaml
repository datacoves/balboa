name: us_population
source:
  connection: github
  path: dataprofessor/dashboard-v3/master/data/us-population-2010-2019.csv
  format: csv
destination:
  connection: warehouse
  dataset_name: us_population
  table_name: us_population
  write_disposition: replace
  after_load:
    - ref: utils.datacoves_utils:record_row_counts   # rows loaded per table → _dlt_load_counts
dependencies: ["dlt[http]"]   # reads https:// files

schedule:
  airflow: {schedule: "0 0 1 */12 *"}
