name: country_populations
source:
  connection: github
  path: datasets/population/master/data/population.csv
  format: csv
destination:
  connection: warehouse
  dataset_name: raw
  table_name: country_populations
  write_disposition: replace
  after_load:
    - ref: utils.datacoves_utils:record_row_counts   # rows loaded per table → _dlt_load_counts
dependencies: ["dlt[http]"]   # reads https:// files

schedule:
  airflow: {schedule: "0 0 1 */12 *"}
