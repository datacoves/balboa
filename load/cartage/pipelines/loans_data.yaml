name: loans_data
source:
  type: dlt
  ref: sources.web:csv_files
  with:
    files:
      personal_loans: https://datacoves-sample-data-public.s3.us-west-2.amazonaws.com/PERSONAL_LOANS.csv
      zip_coordinates: https://datacoves-sample-data-public.s3.us-west-2.amazonaws.com/ZIP_COORDINATES.csv
destination:
  connection: snowflake
  dataset_name: loans
  write_disposition: replace
  after_load:
    - ref: utils.datacoves_utils:apply_pii_tag
      with: { table: personal_loans, columns: [addr_state, annual_inc] }
    - ref: utils.datacoves_utils:enable_change_tracking   # for Dynamic Tables
      with: { tables: [personal_loans, zip_coordinates] }
