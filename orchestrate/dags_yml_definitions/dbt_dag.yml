doc_md: |
  ## Sample DAG showing how to run dbt
  This DAG shows how to run a dbt task

imports:
  - "from orchestrate.utils import datacoves_utils"

catchup: false

# Black will reformat this to one line without the trailing comma, also note
# the two-space indent will get reformatted to the correct four
default_args: !py |
  datacoves_utils.set_default_args(
    owner = 'Noel Gomez',
    owner_email = 'noel@example.com',)

schedule: !py datacoves_utils.set_schedule('0 0 1 */12 *')

description: "Sample DAG demonstrating how to run dbt in airflow"
tags:
  - transform

nodes:
  run_dbt:
    type: task
    task_decorator: datacoves_dbt
    connection_id: main_key_pair
    bash_command: "dbt debug"
