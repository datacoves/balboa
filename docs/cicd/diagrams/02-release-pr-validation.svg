<text x="50" y="46" fill="#1e1e1e" font-size="22" font-weight="bold">CI/CD (2): Release PR — validate against a clone of production</text>
<text x="50" y="184" fill="#1e1e1e" font-size="14" font-weight="bold">Validate</text>
<text x="50" y="386" fill="#1e1e1e" font-size="14" font-weight="bold">Build &amp; promote through a clone of production</text>
<text x="755" y="219" fill="#1e1e1e" font-size="14" font-weight="bold">Databases (blue-green)</text>
<text x="300.0" y="109.1" fill="#1a2f6b" font-size="13" text-anchor="middle">Pull Request targeting  main</text>
<text x="300.0" y="126.0" fill="#1a2f6b" font-size="13" text-anchor="middle">(from a release  rb/*  or hotfix  hf/*  branch)</text>
<text x="300.0" y="221.6" fill="#0b3d66" font-size="13" text-anchor="middle">Check branch naming &amp; merge rules</text>
<text x="300.0" y="297.1" fill="#5c3d00" font-size="13" text-anchor="middle">Which branch</text>
<text x="300.0" y="314.0" fill="#5c3d00" font-size="13" text-anchor="middle">type?</text>
<text x="632.5" y="293.6" fill="#343a40" font-size="12" text-anchor="middle">infra/* → cannot change dbt</text>
<text x="632.5" y="309.2" fill="#343a40" font-size="12" text-anchor="middle">models; passes after branch</text>
<text x="632.5" y="324.8" fill="#343a40" font-size="12" text-anchor="middle">validation only (no build)</text>
<text x="300.0" y="436.1" fill="#5c3d00" font-size="13" text-anchor="middle">Was QA already</text>
<text x="300.0" y="453.0" fill="#5c3d00" font-size="13" text-anchor="middle">refreshed today?</text>
<text x="632.5" y="435.4" fill="#343a40" font-size="12" text-anchor="middle">Yes → build directly on QA;</text>
<text x="632.5" y="451.0" fill="#343a40" font-size="12" text-anchor="middle">skip the clone &amp; swap</text>
<text x="300.0" y="530.1" fill="#3b2a63" font-size="13" text-anchor="middle">Clone the PRODUCTION database</text>
<text x="300.0" y="547.0" fill="#3b2a63" font-size="13" text-anchor="middle">into a temporary copy  (zero-copy)</text>
<text x="300.0" y="605.5" fill="#0b3d66" font-size="13" text-anchor="middle">Fetch production artifacts</text>
<text x="300.0" y="667.1" fill="#12521f" font-size="13" text-anchor="middle">Full dbt build against the clone</text>
<text x="300.0" y="684.0" fill="#12521f" font-size="13" text-anchor="middle">slim (changed + downstream)  or  full</text>
<text x="300.0" y="747.1" fill="#1a2f6b" font-size="13" text-anchor="middle">Blue-green swap: promote the temporary</text>
<text x="300.0" y="764.0" fill="#1a2f6b" font-size="13" text-anchor="middle">copy to the stable QA / pre-prod database</text>
<text x="300.0" y="827.5" fill="#1a2f6b" font-size="13" text-anchor="middle">Grant access to QA</text>
<text x="867.0" y="277.4" fill="#0b3d66" font-size="12" text-anchor="middle">PRODUCTION</text>
<text x="867.0" y="293.0" fill="#0b3d66" font-size="12" text-anchor="middle">(source, read-only)</text>
<text x="867.0" y="463.4" fill="#3b2a63" font-size="12" text-anchor="middle">Temporary copy</text>
<text x="867.0" y="479.0" fill="#3b2a63" font-size="12" text-anchor="middle">(build + test here)</text>
<text x="867.0" y="673.4" fill="#12521f" font-size="12" text-anchor="middle">QA / pre-prod</text>
<text x="867.0" y="689.0" fill="#12521f" font-size="12" text-anchor="middle">(stable, always up)</text>
