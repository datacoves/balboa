<text x="50" y="46" fill="#1e1e1e" font-size="22" font-weight="bold">CI/CD (3): Deploy to Production  (blue-green)</text>
<rect x="45.0" y="164.0" width="172.4" height="19.6" fill="#ffffff"/>
<text x="50" y="180" fill="#1e1e1e" font-size="14" font-weight="bold">Deploy to production</text>
<rect x="45.0" y="504.0" width="131.8" height="19.6" fill="#ffffff"/>
<text x="50" y="520" fill="#1e1e1e" font-size="14" font-weight="bold">Publish results</text>
<rect x="770.0" y="248.0" width="180.5" height="19.6" fill="#ffffff"/>
<text x="775" y="264" fill="#1e1e1e" font-size="14" font-weight="bold">What blue-green means</text>
<text x="280.0" y="106.1" fill="#1a2f6b" font-size="13" text-anchor="middle">A release branch is merged to  main</text>
<text x="280.0" y="123.0" fill="#1a2f6b" font-size="13" text-anchor="middle">→ the production deploy runs</text>
<text x="280.0" y="216.6" fill="#0b3d66" font-size="13" text-anchor="middle">Fetch production artifacts</text>
<text x="280.0" y="275.1" fill="#5c3d00" font-size="13" text-anchor="middle">Check the merge commit for a</text>
<text x="280.0" y="292.0" fill="#5c3d00" font-size="13" text-anchor="middle">full-refresh marker  (sets the mode)</text>
<text x="625.0" y="277.7" fill="#343a40" font-size="11" text-anchor="middle">with marker → full refresh (rebuild all)</text>
<text x="625.0" y="292.0" fill="#343a40" font-size="11" text-anchor="middle">without → normal, deferred deploy</text>
<text x="280.0" y="375.6" fill="#1a2f6b" font-size="13" text-anchor="middle">Blue-green deploy to PRODUCTION</text>
<text x="625.0" y="367.4" fill="#7a1212" font-size="12" text-anchor="middle">On failure → drop the</text>
<text x="625.0" y="383.0" fill="#7a1212" font-size="12" text-anchor="middle">staging (green) database</text>
<text x="280.0" y="447.1" fill="#3b2a63" font-size="13" text-anchor="middle">Drop orphaned relations</text>
<text x="280.0" y="464.0" fill="#3b2a63" font-size="13" text-anchor="middle">(objects for models that were removed)</text>
<text x="280.0" y="556.5" fill="#0b3d66" font-size="13" text-anchor="middle">Generate documentation</text>
<text x="280.0" y="619.5" fill="#0b3d66" font-size="13" text-anchor="middle">Publish docs  (pipeline artifact + docs branch)</text>
<text x="280.0" y="688.5" fill="#12521f" font-size="13" text-anchor="middle">Push dbt artifacts to the Datacoves API</text>
<text x="625.0" y="681.7" fill="#343a40" font-size="11" text-anchor="middle">this becomes the production state</text>
<text x="625.0" y="696.0" fill="#343a40" font-size="11" text-anchor="middle">that future PRs defer to  (diagrams 1 &amp; 2)</text>
<text x="280.0" y="755.5" fill="#343a40" font-size="13" text-anchor="middle">Bump version &amp; push git tags</text>
<text x="897.5" y="318.4" fill="#0b3d66" font-size="12" text-anchor="middle">PRODUCTION</text>
<text x="897.5" y="334.0" fill="#0b3d66" font-size="12" text-anchor="middle">(current, live)</text>
<text x="897.5" y="462.4" fill="#12521f" font-size="12" text-anchor="middle">Green copy</text>
<text x="897.5" y="478.0" fill="#12521f" font-size="12" text-anchor="middle">(build the changes here)</text>
<text x="897.5" y="591.4" fill="#343a40" font-size="12" text-anchor="middle">Swap: green becomes live;</text>
<text x="897.5" y="607.0" fill="#343a40" font-size="12" text-anchor="middle">the old copy is dropped</text>
<rect x="443.8" y="375.0" width="82.4" height="18.0" fill="#ffffff"/>
<text x="485.0" y="388.2" fill="#495057" font-size="12" text-anchor="middle">on failure</text>
<rect x="832.1" y="385.0" width="104.7" height="18.0" fill="#ffffff"/>
<text x="884.5" y="398.2" fill="#495057" font-size="12" text-anchor="middle">clone + build</text>
<rect x="865.6" y="525.0" width="37.8" height="18.0" fill="#ffffff"/>
<text x="884.5" y="538.2" fill="#495057" font-size="12" text-anchor="middle">swap</text>
</svg>