<text x="50" y="46" fill="#1e1e1e" font-size="22" font-weight="bold">CI/CD (1): Feature Pull Request — validation &amp; governance</text>
<text x="50" y="182" fill="#1e1e1e" font-size="14" font-weight="bold">Validate</text>
<text x="50" y="380" fill="#1e1e1e" font-size="14" font-weight="bold">Build &amp; validate in an isolated per-PR database</text>
<text x="50" y="626" fill="#1e1e1e" font-size="14" font-weight="bold">Governance — validate fast, fail fast</text>
<text x="50" y="860" fill="#1e1e1e" font-size="14" font-weight="bold">Build with data</text>
<text x="385.0" y="108.1" fill="#1a2f6b" font-size="13" text-anchor="middle">A developer opens a Pull Request</text>
<text x="385.0" y="125.0" fill="#1a2f6b" font-size="13" text-anchor="middle">(feature branch → release branch)</text>
<text x="385.0" y="221.6" fill="#0b3d66" font-size="13" text-anchor="middle">Check branch naming &amp; merge rules</text>
<text x="385.0" y="297.1" fill="#5c3d00" font-size="13" text-anchor="middle">Were dbt</text>
<text x="385.0" y="314.0" fill="#5c3d00" font-size="13" text-anchor="middle">models changed?</text>
<text x="705.0" y="306.4" fill="#343a40" font-size="12" text-anchor="middle">No → skip the build</text>
<text x="705.0" y="322.0" fill="#343a40" font-size="12" text-anchor="middle">(nothing to validate)</text>
<text x="385.0" y="414.1" fill="#3b2a63" font-size="13" text-anchor="middle">Create a temporary database for this PR</text>
<text x="385.0" y="431.0" fill="#3b2a63" font-size="13" text-anchor="middle">(isolated from production)</text>
<text x="385.0" y="482.1" fill="#0b3d66" font-size="13" text-anchor="middle">Fetch production artifacts</text>
<text x="385.0" y="499.0" fill="#0b3d66" font-size="13" text-anchor="middle">(what prod looks like today)</text>
<text x="385.0" y="551.1" fill="#3b2a63" font-size="13" text-anchor="middle">Clone unchanged incremental &amp; snapshot models</text>
<text x="385.0" y="568.0" fill="#3b2a63" font-size="13" text-anchor="middle">(zero-copy — no expensive rebuild)</text>
<text x="385.0" y="661.1" fill="#5c3d00" font-size="13" text-anchor="middle">Build EMPTY models  (structure only, no data)</text>
<text x="385.0" y="678.0" fill="#5c3d00" font-size="13" text-anchor="middle">runs hooks &amp; policies, catches errors early</text>
<text x="385.0" y="738.5" fill="#0b3d66" font-size="13" text-anchor="middle">Generate documentation</text>
<text x="385.0" y="800.5" fill="#5c3d00" font-size="13" text-anchor="middle">Run governance checks  (style, policy, lint)</text>
<text x="385.0" y="900.5" fill="#12521f" font-size="13" text-anchor="middle">Build models WITH data  +  run data tests</text>
<text x="385.0" y="967.5" fill="#1a2f6b" font-size="13" text-anchor="middle">Grant access to the PR database</text>
<text x="705.0" y="959.1" fill="#7a1212" font-size="13" text-anchor="middle">On failure →</text>
<text x="705.0" y="976.0" fill="#7a1212" font-size="13" text-anchor="middle">drop the PR database</text>
<text x="735.0" y="720.8" fill="#343a40" font-size="12" text-anchor="middle">Build mode — applies to BOTH builds</text>
<text x="735.0" y="736.4" fill="#343a40" font-size="12" text-anchor="middle">(the empty run and the real run)</text>
<text x="735.0" y="752.0" fill="#343a40" font-size="12" text-anchor="middle"></text>
<text x="735.0" y="767.6" fill="#343a40" font-size="12" text-anchor="middle">Slim  (default)</text>
<text x="735.0" y="783.2" fill="#343a40" font-size="12" text-anchor="middle">only changed models + everything</text>
<text x="735.0" y="798.8" fill="#343a40" font-size="12" text-anchor="middle">downstream; the rest is deferred to prod</text>
<text x="735.0" y="814.4" fill="#343a40" font-size="12" text-anchor="middle"></text>
<text x="735.0" y="830.0" fill="#343a40" font-size="12" text-anchor="middle">Full refresh</text>
<text x="735.0" y="845.6" fill="#343a40" font-size="12" text-anchor="middle">rebuild every model</text>
<text x="610.0" y="295.2" fill="#495057" font-size="12" text-anchor="middle">no</text>
<text x="610.0" y="957.2" fill="#495057" font-size="12" text-anchor="middle">on failure</text>
</svg>