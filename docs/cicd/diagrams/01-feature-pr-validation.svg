<text x="50" y="44" fill="#1e1e1e" font-size="20" font-weight="bold">CI/CD (1): Feature PR — validation &amp; governance   ·   fb/* → rb/*   ·   Azure DevOps</text>
<text x="50" y="182" fill="#1e1e1e" font-size="14" font-weight="bold">JOB 1 · validate_branch</text>
<text x="50" y="386" fill="#1e1e1e" font-size="14" font-weight="bold">JOB 2 · dbt   ·   container: datacoves/ci-basic-dbt-snowflake:5.0</text>
<text x="50" y="704" fill="#1e1e1e" font-size="14" font-weight="bold">Governance run — fail fast (only if a prod manifest was found)</text>
<text x="50" y="948" fill="#1e1e1e" font-size="14" font-weight="bold">Real build (after governance passes)</text>
<text x="385.0" y="108.1" fill="#1a2f6b" font-size="13" text-anchor="middle">Trigger: PR  fb/* → rb/*</text>
<text x="385.0" y="125.0" fill="#1a2f6b" font-size="13" text-anchor="middle">(Azure DevOps branch-policy build validation)</text>
<text x="385.0" y="222.6" fill="#0b3d66" font-size="13" text-anchor="middle">Validate branch names &amp; merge rules  (branch_validator.py)</text>
<text x="385.0" y="301.1" fill="#5c3d00" font-size="13" text-anchor="middle">Changes in transform/</text>
<text x="385.0" y="318.0" fill="#5c3d00" font-size="13" text-anchor="middle">or automate/dbt/ ?</text>
<text x="695.0" y="318.6" fill="#343a40" font-size="13" text-anchor="middle">No → skip dbt job</text>
<text x="385.0" y="424.6" fill="#0b3d66" font-size="13" text-anchor="middle">dbt deps</text>
<text x="385.0" y="492.6" fill="#3b2a63" font-size="13" text-anchor="middle">Create PR database   ·   TST_EDP__PR&lt;PullRequestId&gt;</text>
<text x="385.0" y="560.5" fill="#0b3d66" font-size="13" text-anchor="middle">Get prod manifest from Datacoves API  (get_artifacts_from_api.sh)</text>
<text x="385.0" y="625.1" fill="#3b2a63" font-size="13" text-anchor="middle">Clone unchanged incremental + snapshot models</text>
<text x="385.0" y="642.0" fill="#3b2a63" font-size="13" text-anchor="middle">dbt clone … state:old   (zero-copy)</text>
<text x="385.0" y="741.1" fill="#5c3d00" font-size="13" text-anchor="middle">Build EMPTY models   ·   dbt build --empty --defer</text>
<text x="385.0" y="758.0" fill="#5c3d00" font-size="13" text-anchor="middle">--select state:modified+   (schema only → run hooks, fail fast)</text>
<text x="385.0" y="820.5" fill="#0b3d66" font-size="13" text-anchor="middle">Generate docs  (dbt-coves --merge-deferred  /  dbt docs generate)</text>
<text x="385.0" y="886.5" fill="#5c3d00" font-size="13" text-anchor="middle">Run governance checks   ·   pre-commit  (origin/&lt;target&gt; → HEAD)</text>
<text x="385.0" y="985.1" fill="#12521f" font-size="13" text-anchor="middle">dbt build with REAL data</text>
<text x="385.0" y="1002.0" fill="#12521f" font-size="13" text-anchor="middle">slim: --defer --select state:modified+     |     full: --fail-fast</text>
<text x="385.0" y="1063.5" fill="#1a2f6b" font-size="13" text-anchor="middle">Grant access to PR database</text>
<text x="695.0" y="1055.1" fill="#7a1212" font-size="13" text-anchor="middle">On failure →</text>
<text x="695.0" y="1072.0" fill="#7a1212" font-size="13" text-anchor="middle">Drop PR database</text>
<text x="610.0" y="299.2" fill="#495057" font-size="12" text-anchor="middle">no</text>
<text x="385.0" y="392.2" fill="#495057" font-size="12" text-anchor="middle">yes</text>
<text x="610.0" y="1053.2" fill="#495057" font-size="12" text-anchor="middle">on failure</text>
