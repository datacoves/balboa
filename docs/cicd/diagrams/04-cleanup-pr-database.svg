<text x="50" y="45" fill="#1e1e1e" font-size="21" font-weight="bold">CI/CD (4): Clean up the feature PR database</text>
<text x="300.0" y="113.1" fill="#1a2f6b" font-size="13" text-anchor="middle">A feature PR is completed (merged) or abandoned</text>
<text x="300.0" y="130.0" fill="#1a2f6b" font-size="13" text-anchor="middle">→ an Azure service hook fires a webhook</text>
<text x="665.0" y="113.4" fill="#343a40" font-size="12" text-anchor="middle">or run it manually</text>
<text x="665.0" y="129.0" fill="#343a40" font-size="12" text-anchor="middle">with a PR ID</text>
<text x="300.0" y="223.1" fill="#5c3d00" font-size="13" text-anchor="middle">Identify which PR this is for</text>
<text x="300.0" y="240.0" fill="#5c3d00" font-size="13" text-anchor="middle">(stop if no PR id)</text>
<text x="300.0" y="300.6" fill="#0b3d66" font-size="13" text-anchor="middle">Install dbt packages</text>
<text x="300.0" y="366.1" fill="#3b2a63" font-size="13" text-anchor="middle">Drop the temporary per-PR database</text>
<text x="300.0" y="383.0" fill="#3b2a63" font-size="13" text-anchor="middle">(the isolated database created in the feature PR)</text>
