<text x="60" y="51" fill="#1e1e1e" font-size="23" font-weight="bold">CI/CD (1 of N): Release PR — Slim CI validation on a temp clone</text>
<text x="490.0" y="136.5" fill="#343a40" font-size="15" text-anchor="middle">Feature branch</text>
<text x="490.0" y="156.0" fill="#343a40" font-size="15" text-anchor="middle">(developer commits changes)</text>
<text x="490.0" y="241.2" fill="#343a40" font-size="15" text-anchor="middle">Open Pull Request  →  main</text>
<text x="490.0" y="326.5" fill="#1a2f6b" font-size="15" text-anchor="middle">GitHub Actions triggers</text>
<text x="490.0" y="346.0" fill="#1a2f6b" font-size="15" text-anchor="middle">“dbt Release Branch Validations”</text>
<text x="490.0" y="422.1" fill="#0b3d66" font-size="13" text-anchor="middle">Validate branch</text>
<text x="490.0" y="439.0" fill="#0b3d66" font-size="13" text-anchor="middle">(name rules • merge rules • has diff vs main)</text>
<text x="490.0" y="527.8" fill="#5c3d00" font-size="14" text-anchor="middle">QA database</text>
<text x="490.0" y="546.0" fill="#5c3d00" font-size="14" text-anchor="middle">created today?</text>
<text x="490.0" y="630.4" fill="#3b2a63" font-size="12" text-anchor="middle">Clone PROD  →  QA_TEMP</text>
<text x="490.0" y="646.0" fill="#3b2a63" font-size="12" text-anchor="middle">(zero-copy: incremental tables cloned instantly)</text>
<text x="490.0" y="725.1" fill="#0b3d66" font-size="13" text-anchor="middle">Fetch prod artifacts</text>
<text x="490.0" y="742.0" fill="#0b3d66" font-size="13" text-anchor="middle">(manifest.json via get_artifacts.sh)</text>
<text x="490.0" y="812.2" fill="#12521f" font-size="13" text-anchor="middle">dbt build — Slim CI</text>
<text x="490.0" y="829.1" fill="#12521f" font-size="13" text-anchor="middle">--defer --state --select state:modified+</text>
<text x="490.0" y="846.0" fill="#12521f" font-size="13" text-anchor="middle">(+ --full-refresh when labeled  •  or --empty for</text>
<text x="490.0" y="862.9" fill="#12521f" font-size="13" text-anchor="middle">schema-only validation)</text>
<text x="490.0" y="927.1" fill="#1a2f6b" font-size="13" text-anchor="middle">Swap QA_TEMP ⇄ QA, drop old QA</text>
<text x="490.0" y="944.0" fill="#1a2f6b" font-size="13" text-anchor="middle">+ grant access</text>
<text x="490.0" y="1030.9" fill="#343a40" font-size="14" text-anchor="middle">Comment dbt Workflow Status on the PR</text>
<text x="875.0" y="512.6" fill="#343a40" font-size="12" text-anchor="middle">QA created today →</text>
<text x="875.0" y="528.2" fill="#343a40" font-size="12" text-anchor="middle">run against QA directly</text>
<text x="875.0" y="543.8" fill="#343a40" font-size="12" text-anchor="middle">(skip clone)</text>
<text x="490.0" y="597.2" fill="#495057" font-size="12" text-anchor="middle">no</text>
<text x="750.0" y="526.2" fill="#495057" font-size="12" text-anchor="middle">yes</text>
