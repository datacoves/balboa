# Kept in sync with secure/snowcap/resources/warehouses.yml (var.warehouses).
# Snowcap is the source of truth.
#
# AUTO_SUSPEND: Setting 0 or NULL value means the warehouse never suspends
#
# NOT EXPRESSIBLE IN PERMIFROST: snowcap also sets statement_timeout_in_seconds
# (wh_admin 7200, everything else the 3600 default).

- wh_admin:
    size: x-small
    auto_suspend: 60
    auto_resume: true
    initially_suspended: true

