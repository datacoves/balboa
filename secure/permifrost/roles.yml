# Permifrost role spec, kept in sync with secure/snowcap/resources/ as reference
# documentation. Snowcap is the source of truth for this account -- permifrost is
# not run. When the two disagree, snowcap wins and this file gets updated.
#
# Section headers below name the snowcap file each block mirrors.
#
# Four things snowcap grants cannot be expressed in permifrost's vocabulary. They
# are flagged inline where they occur:
#   1. MONITOR on warehouses -- permifrost's `warehouses:` key emits USAGE + OPERATE
#   2. Inherited grants      -- permifrost only has per-object `tables: read`
#   3. Stage privileges      -- no permifrost support at all
#   4. Account-level privs   -- no permifrost support at all

## =====================================================================#
##  Functional Roles            (snowcap: roles__functional.yml)        #
## =====================================================================#

- z_base__analyst:
    member_of:
      # RAW
      - z_db__raw
      - z_schemas__db__raw

      # BALBOA
      - z_db__balboa
      - z_schema__dbt_test__audit
      - z_schema__l1_account_usage
      - z_schema__l1_country_data
      - z_schema__l1_country_geo
      - z_schema__l1_covid19_epidemiological_data
      - z_schema__l1_google_analytics_4
      - z_schema__l1_loans
      - z_schema__l1_observe
      - z_schema__l1_usgs__earthquake_data
      - z_schema__l1_us_population

      - z_schema__l2_country_demographics
      - z_schema__l2_covid_observations
      - z_schema__l2_snowflake_usage

      - z_schema__l3_covid_analytics
      - z_schema__l3_earthquake_analytics
      - z_schema__l3_loan_analytics

      - z_schema__masking_policies
      - z_schema__seeds

      # BALBOA_APPS
      - z_db__balboa_apps
      - z_schema__resources

      # BALBOA_DEV
      - z_db__balboa_dev
      - z_db__balboa_dev__create_schema

      # BALBOA_TST used to grant usage to PR databases
      - z_db__balboa_tst

      # BALBOA_QA used to grant usage to QA database
      - z_db__balboa_qa

      # GREAT_BAY
      - z_db__great_bay
      - z_db__sushi_db

      # Shared DBs
      - z_db__covid19_epidemiological_data
      - z_db__snowflake

      # STAGES
      - z_stage__raw__dbt_artifacts__artifacts__read

      # WAREHOUSES
      - z_wh__wh_transforming
      - z_wh__wh_transforming_dynamic_tables

- analyst:
    member_of:
      - z_base__analyst
      - z_tables_views__select

- analyst_pii:
    member_of:
      - analyst

- de__analyst:
    member_of:
      - z_base__analyst
      - z_tables_views__select

- de__analyst_pii:
    member_of:
      - de__analyst

- finance_team:
    member_of:
      - z_db__balboa
      - z_schema__l3_loan_analytics
      - z_wh__wh_finance

- catalog:
    member_of:
      - z_wh__wh_catalog
      - z_base__analyst
      - z_tables_views__select

- loader:
    member_of:
      - z_wh__wh_loading
    owns:
      databases:
        - raw

- transformer_dbt:
    member_of:
      - z_account__create_database

      # RAW
      - z_db__raw
      - z_schemas__db__raw

      # Shared DBs
      - z_db__covid19_epidemiological_data
      - z_db__snowflake

      - z_wh__wh_orchestrating
      - z_wh__wh_integration
      - z_wh__wh_transforming
      - z_wh__wh_transforming_dynamic_tables

      - z_stage__raw__dbt_artifacts__artifacts__write
      - z_stage__balboa_apps__resources__streamlit__write

      - z_tables_views__select
    owns:
      databases:
        - balboa
        - balboa_apps
        - balboa_dev
        - balboa_qa
        - great_bay
        - sushi_db
      schemas:
        - balboa.*
        - balboa_apps.*
        - great_bay.*
        - raw.dbt_artifacts
        - raw.snapshots

- bot_integration:
    owner: useradmin
    member_of:
      - transformer_dbt
      - z_wh__wh_integration

## =====================================================================#
##  Base / Privilege Roles           (snowcap: roles__base.yml)         #
## =====================================================================#

# NOT EXPRESSIBLE IN PERMIFROST: snowcap grants CREATE DATABASE ON ACCOUNT to this
# role. Permifrost has no account-scope privileges, so the role is declared here
# for the hierarchy only. The grant itself must be run by hand:
#   grant create database on account to role z_account__create_database;
- z_account__create_database:
    owner: securityadmin

# APPROXIMATION: snowcap grants only CREATE SCHEMA on balboa_dev. Permifrost's
# `write` is broader -- it also emits MONITOR and MODIFY.
- z_db__balboa_dev__create_schema:
    privileges:
      databases:
        write:
          - balboa_dev

- z_schemas__db__raw:
    privileges:
      schemas:
        read:
          - raw.*

- z_schemas__db__governance:
    privileges:
      schemas:
        read:
          - governance.*

# APPROXIMATION: snowcap uses Snowflake inherited grants here, one per object type
# per database, covering current and future objects:
#   priv: SELECT / on: inherited {tables,dynamic tables,views} in database <db>
# Permifrost has no inherited-grant support, so this expands to per-object grants.
- z_tables_views__select:
    privileges:
      tables:
        read:
          - governance.*.*
          - raw.*.*
          - balboa.*.*
          - balboa_apps.*.*
          - balboa_dev.*.*
          - balboa_qa.*.*
          - great_bay.*.*
          - sushi_db.*.*

# Used to grant access to TST databases; grants added by the CI script
- z_db__tst_balboa:
    owner: useradmin

