## =====================================================================#
##  Warehouse Roles     (snowcap: object_templates/warehouses.yml)      #
## =====================================================================#

# DIVERGENCE, NOT FIXABLE: snowcap grants USAGE + MONITOR on each warehouse.
# Permifrost's `warehouses:` key always emits USAGE + OPERATE and offers no way
# to select privileges. Running permifrost would add OPERATE and revoke MONITOR.

- z_wh__wh_admin:
    warehouses:
      - wh_admin

- z_wh__wh_catalog:
    warehouses:
      - wh_catalog

- z_wh__wh_finance:
    warehouses:
      - wh_finance

- z_wh__wh_integration:
    warehouses:
      - wh_integration

- z_wh__wh_loading:
    warehouses:
      - wh_loading

- z_wh__wh_orchestrating:
    warehouses:
      - wh_orchestrating

- z_wh__wh_transforming:
    warehouses:
      - wh_transforming

- z_wh__wh_transforming_dynamic_tables:
    warehouses:
      - wh_transforming_dynamic_tables

- z_wh__wh_transforming_sqlmesh:
    warehouses:
      - wh_transforming_sqlmesh

## =====================================================================#
##  Stage Roles                     (snowcap: stages.yml)               #
## =====================================================================#

# NOT EXPRESSIBLE IN PERMIFROST: stage privileges have no permifrost support.
# The roles are declared for the hierarchy; the grants must be run by hand:
#   use role securityadmin;
#   grant read  on stage raw.dbt_artifacts.artifacts
#     to role z_stage__raw__dbt_artifacts__artifacts__read;
#   grant read, write on stage raw.dbt_artifacts.artifacts
#     to role z_stage__raw__dbt_artifacts__artifacts__write;
#   grant read, write on stage balboa_apps.resources.streamlit
#     to role z_stage__balboa_apps__resources__streamlit__write;

- z_stage__raw__dbt_artifacts__artifacts__read:
    owner: useradmin

- z_stage__raw__dbt_artifacts__artifacts__write:
    owner: useradmin

- z_stage__balboa_apps__resources__streamlit__write:
    owner: useradmin

## =====================================================================#
##  Global Roles                                                        #
## =====================================================================#

- orgadmin:
    owner: ""

- accountadmin:
    member_of:
      - sysadmin
      - securityadmin
      - z_wh__wh_admin

- securityadmin:
    member_of:
      - useradmin
      - z_wh__wh_admin

- useradmin:
    member_of:
      - z_wh__wh_admin

- sysadmin:
    member_of:
      - z_wh__wh_admin
    owns:
      databases:
        - governance
      schemas:
        - governance.*

## =====================================================================#
##  ENTERPRISE / PII ACCOUNT ONLY                                       #
##  (snowcap: resources_enterprise/ -- applied with ./plan.sh --pii)    #
##                                                                      #
##  Snowcap keeps these in a separate directory so the standard account #
##  never sees them. Permifrost's `!include` takes one file per key, so #
##  they stay here, sectioned off, rather than in a roles_enterprise.yml#
## =====================================================================#

# Masking -- tag apply role and the unmask bypass role
- z_tag__apply__pii:
    owner: securityadmin

- z_unmask__pii:
    owner: securityadmin

# Row access -- policy apply role
- z_rap__apply__country__iso_3:
    owner: securityadmin

# Row access -- region roles.
# NOTE: snowcap generates ~150 z_row_access__country_code__iso_3__<iso3> roles from
# `for_each: var.country_code__iso_3` in resources_enterprise/row_access__roles.yml
# and grants them to these region roles. Enumerating them by hand here would be
# unmaintainable, so only the region tier is mirrored. See that file for the
# authoritative country-to-region mapping.
- z_row_access__region__na:
    owner: securityadmin

- z_row_access__region__latam:
    owner: securityadmin

- z_row_access__region__emea:
    owner: securityadmin

- z_row_access__region__apac:
    owner: securityadmin

- z_policy_row_region_all:
    owner: securityadmin
    member_of:
      - z_row_access__region__na
      - z_row_access__region__latam
      - z_row_access__region__emea
      - z_row_access__region__apac

# Enterprise-only role grants. Snowcap applies these from
# resources_enterprise/masking__role_grants.yml and row_access__role_grants.yml,
# layered on top of the base functional roles above. Permifrost has no layering,
# so they are recorded here as comments rather than silently diverging:
#
#   z_base__analyst  += z_tag__apply__pii, z_db__governance, z_schemas__db__governance,
#                       z_rap__apply__country__iso_3
#   loader           += z_tag__apply__pii, z_db__governance, z_schemas__db__governance
#   transformer_dbt  += z_tag__apply__pii, z_db__governance, z_schemas__db__governance,
#                       z_unmask__pii, z_rap__apply__country__iso_3
#   analyst          += z_policy_row_region_all
#   analyst_pii      += z_unmask__pii
#   de__analyst      += z_row_access__country_code__iso_3__deu
#   de__analyst_pii  += z_unmask__pii
#   catalog          += z_policy_row_region_all
