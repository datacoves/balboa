vars:
  - name: warehouses
    type: list
    default:
      - name: wh_admin
        size: x-small
        auto_suspend: 60  # seconds 0 means it never suspends
        statement_timeout_in_seconds: 3600  # seconds; object_templates/warehouses.yml applies 3600 when omitted
      - name: wh_catalog
        size: x-small
        auto_suspend: 60
      - name: wh_finance
        size: x-small
        auto_suspend: 60
      - name: wh_integration
        size: x-small
        auto_suspend: 60
      - name: wh_loading
        size: x-small
        auto_suspend: 60
      - name: wh_orchestrating
        size: x-small
        auto_suspend: 60
      - name: wh_transforming
        size: x-small
        auto_suspend: 60
      - name: wh_transforming_dynamic_tables
        size: x-small
        auto_suspend: 60
      - name: wh_transforming_sqlmesh
        size: x-small
        auto_suspend: 60
