roles:
  - name: z_base__analyst

  - name: catalog
  - name: bot_integration

  - name: analyst
  - name: analyst_pii
  - name: de__analyst
  - name: de__analyst_pii

  - name: loader
  - name: transformer_dbt

  - name: finance_team

  # analyst plus account-wide metadata visibility. Composed from analyst so it
  # works as a default role -- the MCP connector runs as whatever role the user
  # defaults to, and needs the data access as well as the visibility.
  - name: account_monitor

database_role_grants:
  # Snowflake-provided. CORTEX_USER is what lets the MCP connector's SQL
  # execution agent run at all -- without it every call fails with
  # "Unauthorized to call Cortex Agents".
  - database_role: snowflake.cortex_user
    roles:
      - z_base__analyst

role_grants:
  - to_role: finance_team
    roles:
      - z_db__balboa
      - z_schema__l3_loan_analytics
      - z_wh__wh_finance

  - to_role: z_base__analyst
    roles:
      # RAW
      - z_db__raw
      - z_schemas__db__raw

      # BALBOA
      - z_db__balboa
      - z_schema__dbt_test__audit
      - z_schema__l1_account_usage
      - z_schema__l1_country_data
      - z_schema__l1_country_geo
      - z_schema__l1_covid19_epidemiological_data
      - z_schema__l1_google_analytics_4
      - z_schema__l1_loans
      - z_schema__l1_observe
      - z_schema__l1_usgs__earthquake_data
      - z_schema__l1_us_population

      - z_schema__l2_country_demographics
      - z_schema__l2_covid_observations
      - z_schema__l2_snowflake_usage

      - z_schema__l3_covid_analytics
      - z_schema__l3_earthquake_analytics
      - z_schema__l3_loan_analytics

      - z_schema__masking_policies
      - z_schema__seeds

      # BALBOA_APPS
      - z_db__balboa_apps
      - z_schema__resources

      # BALBOA_DEV
      - z_db__balboa_dev
      - z_db__balboa_dev__create_schema

      # BALBOA_TST used to grant usage to PR databases
      - z_db__balboa_tst

      # BALBOA_QA used to grant usage to QA database
      - z_db__balboa_qa

      # GREAT_BAY -- same shape as BALBOA: database usage plus a role per
      # schema, rather than the database-role pair it used to use.
      - z_db__great_bay
      - z_schema__cove_marketing

      # GREAT_BAY_DEV -- same shape as BALBOA_DEV: usage plus CREATE SCHEMA,
      # so each developer owns the schema they create.
      - z_db__great_bay_dev
      - z_db__great_bay_dev__create_schema

      # Shared DBs
      - z_db__covid19_epidemiological_data
      - z_db__snowflake
      - z_db__snowflake_learning_db
      - z_db__snowflake_sample_data
      - z_schemas__db__snowflake_learning_db
      - z_db__worldwide_address_data

      # STAGES
      - z_stage__raw__dbt_artifacts__artifacts__read
      - z_stage__raw__raw__ext_jsonfiles_stage__read

      # STREAMLIT
      - z_streamlit__balboa_apps__resources__loans

      # WAREHOUSES
      - z_wh__wh_transforming
      - z_wh__wh_transforming_dynamic_tables

      # ALERTS
      - z_account__execute_alert                    # ERROR_ALERT (serverless, suspended)
      - z_integration__send_email_notifications
      - z_integration__send_slack_notifications

      # TASKS
      - z_account__execute_task

      # MCP -- reaches ADMIN_DB.MCPS.DATACOVES, the cortex agent server the
      # Claude MCP connector runs its SQL through
      - z_db__admin_db
      - z_schema__mcps
      - z_mcp__datacoves


  - to_role: account_monitor
    roles:
      - analyst
      - z_account__monitor

  - to_role: analyst
    roles:
      - z_base__analyst
      - z_tables_views__select

  - to_role: analyst_pii
    roles:
      - analyst

  - to_role: de__analyst
    roles:
      - z_base__analyst
      - z_tables_views__select

  - to_role: de__analyst_pii
    roles:
      - de__analyst

  - to_role: catalog
    roles:
      - z_wh__wh_catalog
      - z_base__analyst
      - z_tables_views__select

  - to_role: loader
    roles:
      - z_wh__wh_loading
      - z_account__execute_alert                    # TEST_ALERT (serverless, started)
      - z_integration__send_email_notifications
      - z_integration__send_slack_notifications
      - z_schema__raw__raw__create_alert

  - to_role: transformer_dbt
    roles:
      - z_account__create_database

      # RAW
      - z_db__raw
      - z_schemas__db__raw

      # Shared DBs
      - z_db__covid19_epidemiological_data
      - z_db__snowflake
      - z_db__worldwide_address_data

      # Warehouses
      - z_wh__wh_orchestrating
      - z_wh__wh_integration
      - z_wh__wh_transforming
      - z_wh__wh_transforming_dynamic_tables

      - z_stage__raw__dbt_artifacts__artifacts__write
      - z_stage__balboa_apps__resources__streamlit__write

      - z_tables_views__select

  - to_role: bot_integration
    roles:
      - transformer_dbt
      - z_wh__wh_integration
