database_roles:
  - name: dr_create_role
    database: great_bay
    comment: "Database role to create objects"
  - name: dr_reader_role
    database: great_bay
    comment: "Database role for reading"

grants:
  - priv: "USAGE"
    on:
      - "database great_bay"
      - "schema great_bay.cove_marketing"
    to: great_bay.dr_create_role

  - priv:
      - SELECT
      - INSERT
      - UPDATE
    on: FUTURE TABLES IN SCHEMA GREAT_BAY.COVE_MARKETING
    to: great_bay.dr_create_role

  - priv: "USAGE"
    on:
      - "database great_bay"
      - "schema great_bay.cove_marketing"
    to: great_bay.dr_reader_role

  - priv:
      - SELECT
    on: FUTURE TABLES IN SCHEMA GREAT_BAY.COVE_MARKETING
    to: great_bay.dr_reader_role
