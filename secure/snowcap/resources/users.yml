# Users
vars:
  - name: users
    type: list
    default:
      - name: alejandro
        type: PERSON
        default_role: analyst
        default_warehouse: wh_transforming
      - name: fernando
        type: PERSON
        default_role: analyst
        default_warehouse: wh_transforming
      - name: jesus
        type: PERSON
        default_role: analyst
        default_warehouse: wh_transforming
      - name: ian
        type: PERSON
        default_role: analyst
        default_warehouse: wh_transforming
      - name: gomezn
        type: PERSON
        default_role: account_monitor
        default_warehouse: wh_transforming
      - name: sebastian
        type: PERSON
        default_role: analyst
        default_warehouse: wh_transforming
      - name: stephen
        type: PERSON
        default_role: analyst
        default_warehouse: wh_transforming

    # Service Accounts
      - name: svc_airbyte
        type: SERVICE
        default_role: loader
        default_warehouse: wh_loading
      - name: svc_airflow
        type: SERVICE
        default_role: transformer_dbt
        default_warehouse: wh_orchestrating
      - name: svc_datacoves
        type: SERVICE
        default_role: securityadmin
        default_warehouse: wh_admin
      - name: svc_fivetran
        type: SERVICE
        default_role: loader
        default_warehouse: wh_loading
      - name: svc_balboa_ci
        type: SERVICE
        default_role: bot_integration
        default_warehouse: wh_integration
      - name: svc_dbt_coves_ci
        type: SERVICE
        default_role: bot_integration
        default_warehouse: wh_integration
      - name: svc_datacoves_platform_ci
        type: SERVICE
        default_role: bot_integration
        default_warehouse: wh_integration
      - name: svc_datahub
        type: SERVICE
        default_role: catalog
        default_warehouse: wh_catalog
      - name: svc_superset
        type: LEGACY_SERVICE
        default_role: analyst
        default_warehouse: wh_transforming

role_grants:
  - to_user: alejandro
    roles:
      - analyst
      - securityadmin

  - to_user: fernando
    roles:
      - analyst

  - to_user: jesus
    roles:
      - analyst
      - loader
      - transformer_dbt
      - accountadmin
      - securityadmin

  - to_user: ian
    roles:
      - analyst

  - to_user: gomezn
    roles:
      - analyst
      - analyst_pii
      - de__analyst
      - de__analyst_pii
      - finance_team
      - great_bay__analyst__reader
      - great_bay__analyst__writer
      - loader
      - transformer_dbt
      - accountadmin
      - securityadmin
      - orgadmin
      - account_monitor                             # analyst + MONITOR on ACCOUNT

  - to_user: sebastian
    roles:
      - analyst
      - loader
      - transformer_dbt
      - accountadmin
      - securityadmin

  - to_user: stephen
    roles:
      - analyst
      - accountadmin
      - securityadmin

  - to_user: svc_airbyte
    roles:
      - loader

  - to_user: svc_airflow
    roles:
      - loader
      - transformer_dbt

  - to_user: svc_datacoves
    roles:
      - securityadmin

  - to_user: svc_fivetran
    roles:
      - loader

  # Used by GH Actions on Balboa repo
  - to_user: svc_balboa_ci
    roles:
      - bot_integration
      - transformer_dbt

  - to_user: svc_dbt_coves_ci
    roles:
