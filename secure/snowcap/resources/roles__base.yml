roles:
  - name: z_account__create_database
  - name: z_account__manage_grants
  - name: z_account__monitor
  - name: z_db__tst_balboa  # Used to grant access to TST databases
  - name: z_db__balboa_dev__create_schema
  - name: z_db__great_bay_dev__create_schema

  - name: z_schemas__db__raw
  - name: z_schemas__db__governance

  - name: z_tables_views__select

  - name: z_unmask__pii

grants:
  - priv: "CREATE DATABASE"
    on: "ACCOUNT"
    to: z_account__create_database

  # Lets the blue-green deployment reissue the read grants a swap drops. The
  # swap replaces the database, so the inherited SELECT grants below have to be
  # recreated afterwards by grant_db_usage in the dbt project, which runs as
  # transformer_dbt. Inherited grants cover future objects, and granting those
  # to an account-level role such as z_tables_views__select needs the
  # account-wide MANAGE GRANTS -- owning the database is not enough, which is
  # why the 2026-09-11 deploys failed with "Grant not executed: Insufficient
  # privileges". Granting them to a database role inside a database
  # transformer_dbt owns does work unprivileged, which is how GREAT_BAY_DEV's
  # dr_reader_role gets the same grants without this role.
  #
  # This is broad: the holder can grant any privilege on any object to any
  # role, the same grant authority SECURITYADMIN has. It reaches only
  # transformer_dbt, which CI and Airflow connect as.
  - priv: "MANAGE GRANTS"
    on: "ACCOUNT"
    to: z_account__manage_grants

  # Account-wide metadata visibility: SHOW ROLES/USERS/GRANTS beyond your own
  # role. Reads no data and exposes no other user's queries, but it does lay
  # out the whole RBAC graph, so it stays off z_base__analyst and reaches one
  # person through the account_monitor role.
  - priv: "MONITOR"
    on: "ACCOUNT"
    to: z_account__monitor

  - priv: "CREATE SCHEMA"
    on: "database balboa_dev"
    to: z_db__balboa_dev__create_schema

  - priv: "CREATE SCHEMA"
    on: "database great_bay_dev"
    to: z_db__great_bay_dev__create_schema

  # Inherited grants, not the "all X" plus "future X" pair they replace. One
  # grant on the container covers every object of the type in it, existing and
  # future alike, and requires FEATURE_RBAC_INHERITED_GRANTS in account.yml.
  #
  # Three reasons this config uses them:
  #
  #   - Snowflake keeps an inherited grant as one durable record, so plan can
  #     compare it against config. Grants on all objects cannot be compared, so
  #     snowcap reapplied them on every run -- that was the 40 CREATE lines in
  #     every plan, none of which were real changes.
  #   - A future grant at schema level silently overrides one at database level.
  #     Inherited grants are not shadowed that way, so adding a schema-level
  #     grant later cannot quietly cut off the database-level one.
  #   - One record instead of one per object, plus a future grant.
  - priv: "USAGE"
    on: "inherited schemas in database raw"
    to: z_schemas__db__raw

  - priv: "USAGE"
    on: "inherited schemas in database governance"
    to: z_schemas__db__governance

  - for_each: var.databases
    priv: "SELECT"
    on:
      - "inherited tables in database {{ each.value.name }}"
      - "inherited dynamic tables in database {{ each.value.name }}"
      - "inherited views in database {{ each.value.name }}"
    to: z_tables_views__select
