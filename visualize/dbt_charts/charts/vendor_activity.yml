_schema_version: "0.12.0"  # written automatically by dct migrate
title: Vendor Activity
notes: >
  Accounts Payable view of Balboa's vendors. "Active" follows the Atlas Active Vendor
  definition of record: a PO or invoice in the trailing 12 months, measured back from the
  latest activity date in the data. The ERP's recorded status is shown alongside so the
  gap between the two is visible.
source: balboa

variables:
  grain:
    input: radio
    label: Period
    options:
      static: [month, quarter, week]
    default: month
    required: true
  category:
    input: select
    options:
      query: category_options

queries:
  category_options: |
    select distinct vendor_category as category from {{ ref('mart_vendor_activity') }}
    order by category

  kpis: |
    select
      count_if(is_active_vendor) as active_vendors,
      count(*) as total_vendors,
      count_if(is_active_vendor) / nullif(count(*), 0) as active_share,
      count_if(is_recorded_status_mismatch) as status_mismatches
    from {{ ref('mart_vendor_activity') }}
    where {{ filter('vendor_category', category) }}

  open_invoices: |
    select sum(i.invoice_amount) as open_amount, count(*) as open_count
    from {{ ref('stg_invoices__erp') }} i
    join {{ ref('mart_vendor_activity') }} v using (vendor_id)
    where i.invoice_status = 'open'
      and {{ filter('v.vendor_category', category) }}

  active_by_period: |
    with activity as (
      select vendor_id, po_date as activity_date from {{ ref('stg_purchase_orders__erp') }}
      union all
      select vendor_id, invoice_date from {{ ref('stg_invoices__erp') }}
    ),
    bounds as (
      select min(activity_date) as first_date, max(activity_date) as last_date
      from activity
    ),
    days as (
      select dateadd(day, seq4(), b.first_date) as d
      from bounds b, table(generator(rowcount => 10000))
      where dateadd(day, seq4(), b.first_date) <= b.last_date
    ),
    period_ends as (
      select distinct
        case '{{ grain }}'
          when 'week' then dateadd(day, 7 - dayofweekiso(d), d)
          when 'quarter' then last_day(d, 'quarter')
          else last_day(d, 'month')
        end as period_end_date
      from days
    )
    select p.period_end_date, count(distinct a.vendor_id) as vendors_with_activity
    from period_ends p
    cross join bounds b
    join activity a
      on a.activity_date > dateadd(day, -90, p.period_end_date)
      and a.activity_date <= p.period_end_date
    join {{ ref('mart_vendor_activity') }} v on v.vendor_id = a.vendor_id
    where p.period_end_date <= b.last_date
      and {{ filter('v.vendor_category', category) }}
    group by 1
    order by 1

  spend_by_month: |
    select date_trunc('month', po.po_date) as month, v.vendor_category as category, sum(po.po_amount) as po_amount
    from {{ ref('stg_purchase_orders__erp') }} po
    join {{ ref('mart_vendor_activity') }} v using (vendor_id)
    where {{ filter('v.vendor_category', category) }}
    group by 1, 2
    order by 1

  status_by_category: |
    select
      vendor_category as category,
      case
        when is_active_vendor and vendor_recorded_status = 'active' then 'Active (matches ERP)'
        when is_active_vendor then 'Active, ERP says inactive'
        when vendor_recorded_status = 'active' then 'Dormant, ERP says active'
        else 'Dormant (matches ERP)'
      end as status_check,
      count(*) as vendors
    from {{ ref('mart_vendor_activity') }}
    where {{ filter('vendor_category', category) }}
    group by 1, 2
    order by
      case category
        when 'Consulting' then 1
        when 'Logistics' then 2
        when 'Lab Supplies' then 3
        when 'IT / Software' then 4
        when 'Packaging' then 5
        when 'Facilities' then 6
        when 'CRO Services' then 7
        when 'Clinical Reagents' then 8
        else 9
      end,
      case status_check
        when 'Active (matches ERP)' then 1
        when 'Dormant (matches ERP)' then 2
        when 'Active, ERP says inactive' then 3
        else 4
      end

  invoice_aging: |
    select v.vendor_name,
      count(*) as open_invoices,
      sum(i.invoice_amount) as open_amount,
      min(i.invoice_date) as oldest_open_invoice
    from {{ ref('stg_invoices__erp') }} i
    join {{ ref('mart_vendor_activity') }} v using (vendor_id)
    where i.invoice_status = 'open'
      and {{ filter('v.vendor_category', category) }}
    group by 1
    order by open_amount desc, oldest_open_invoice desc

charts:
  kpi_active:
    type: kpi
    query: kpis
    label: Active Vendors (Trailing 12 Months)
    value: active_vendors
    support:
      value: active_share
      label: of all vendors
    style:
      value:
        format: integer
      support:
        format: "percent_whole"

  kpi_mismatch:
    type: kpi
    query: kpis
    label: ERP Status Disagrees with Activity
    value: status_mismatches
    style:
      value:
        format: integer

  kpi_open:
    type: kpi
    query: open_invoices
    label: Open Invoice Balance
    value: open_amount
    style:
      value:
        format: currency_whole

  active_trend:
    type: line
    query: active_by_period
    title: Vendors with Activity in the Prior 90 Days
    subtitle: Vendors with a PO or invoice in the 90 days before each completed period end
    x: period_end_date
    y: vendors_with_activity
    x_label: Period end
    y_label: Vendors with activity
    style:
      axis_x:
        labels:
          format: "%b %Y"

  spend_trend:
    type: bar
    query: spend_by_month
    title: Purchase Order Spend by Month
    subtitle: Committed PO amount, stacked by vendor category
    x: month
    y: po_amount
    color: category
    x_label: Month
    y_label: PO spend
    style:
      stack: zero
      axis_y:
        labels:
          format: "currency_whole"

  status_check:
    type: bar
    query: status_by_category
    title: Does the ERP Status Match Real Activity?
    subtitle: Vendors per category, by behavioral activity vs. recorded ERP status
    x: category
    y: vendors
    color: status_check
    x_label: Category
    y_label: Vendors
    field_labels:
      status_check: Status Check
    style:
      orientation: horizontal
      stack: zero

  aging_table:
    type: table
    query: invoice_aging
    title: Open Invoices by Vendor
    style:
      columns:
        vendor_name: { label: Vendor }
        open_invoices: { label: Open Invoices, format: integer }
        open_amount: { label: Open Amount, format: currency_whole }
        oldest_open_invoice: { label: Oldest Open Invoice, format: date_short }

rows:
  - cols: [kpi_active, kpi_mismatch, kpi_open]
  - cols: [active_trend, spend_trend]
  - cols: [status_check, aging_table]
