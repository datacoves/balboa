name: "15: 🗑️ Drop test databases"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - 'release/**/*'
    types:
      - closed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose test database should be dropped"
        required: true
        type: number

jobs:
  # Drops the temporary PR database, but only when the PR was abandoned
  # (closed without merging). A merged PR's database is kept until pipeline
  # 30 (deploy to production) drops it after the release that includes this
  # PR has actually shipped, so QA can keep querying it during the release
  # window. See automate/git/get_feature_pr_ids.py and
  # automate/git/sweep_stale_pr_databases.py.
  drop-pr-db-on-close:
    name: Drop PR Database on Close
    # workflow_dispatch has no pull_request context (github.event.pull_request
    # evaluates to null), so it must be allowed explicitly rather than falling
    # through the merged check -- manual runs always drop the database of the
    # PR given in the pr_number input.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == false

    runs-on: ubuntu-latest

    # Set environment variables in
    # https://github.com//<your org>/<your repo>/settings/variables/actions
    #
    # Alternatively, You can define multiple ENV for different workflows.
    # https://github.com/<org>/<repo>/settings/environments
    # environment: PR_ENV
    container: datacoves/ci-basic-dbt-snowflake:6.0

    defaults:
      run:
        working-directory: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/transform

    env:
      DBT_PROFILES_DIR: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/automate/dbt
      DATACOVES__DBT_HOME: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/transform
      DATACOVES__YAML_DAGS_FOLDER: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/schedule

      DATACOVES__MAIN__ACCOUNT:   ${{ vars.DATACOVES__MAIN__ACCOUNT }}

      DATACOVES__MAIN__DATABASE:  ${{ vars.DATACOVES__MAIN__DATABASE }}_PR_${{ github.event.number || inputs.pr_number }}
      DATACOVES__MAIN__SCHEMA:    ${{ vars.DATACOVES__MAIN__SCHEMA }}

      DATACOVES__MAIN__ROLE:      ${{ vars.DATACOVES__MAIN__ROLE }}
      DATACOVES__MAIN__WAREHOUSE: ${{ vars.DATACOVES__MAIN__WAREHOUSE }}

      DATACOVES__MAIN__USER:      ${{ vars.DATACOVES__MAIN__USER }}
      DATACOVES__MAIN__PRIVATE_KEY:  ${{ secrets.DATACOVES__MAIN__PRIVATE_KEY }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set Secure Directory
        run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - name: Install dbt packages
        run: "dbt deps"

      # Never run a drop with an empty or arbitrary database name suffix.
      # POSIX `case` instead of bash `[[ =~ ]]`: this container's `run:` shell is sh.
      - name: Validate PR number
        env:
          PR_NUMBER: ${{ github.event.number || inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "Invalid or missing PR number: '$PR_NUMBER'"; exit 1 ;;
          esac

      - name: Drop PR database
        run: |
          dbt --no-write-json run-operation drop_recreate_db --args "{db_name: $DATACOVES__MAIN__DATABASE, recreate: False}"
