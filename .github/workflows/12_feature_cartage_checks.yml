name: "12: 🚚 Cartage Validations"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - 'release/**/*'
    paths:
      - load/cartage/**/*
      - load/cartage/.cartage/*
      - orchestrate/dags/cartage/**/*

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# This cancels a run if another change is pushed to the same branch
concurrency:
  group: cartage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cartage:
    name: Lint, validate and check generated DAGs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: load/cartage

    env:
      # Same Cartage as the DAGs (orchestrators.airflow.command in .cartage/config.yaml); it adds the pipelines' dependencies
      CARTAGE: uvx --from cartage>=0.16.0 cartage
      # .cartage/config.yaml builds orchestrators.airflow.dags_dir from these; Datacoves sets them, the runner does not
      DATACOVES__REPO_PATH: ${{ github.workspace }}
      DATACOVES__AIRFLOW_DAGS_PATH: orchestrate/dags
      # rfam's credentials live in ~/.cartage/secrets.yaml, which is git-ignored and absent here. validate only
      # resolves secret references, it never connects, so placeholders are enough to check the pipeline wiring.
      CARTAGE_SECRET__RFAM__USERNAME: ci-validate-only
      CARTAGE_SECRET__RFAM__PASSWORD: ci-validate-only

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2   # setup-uv publishes no major tags since v8

      - name: Lint Python (sources, transforms, utils)
        run: uvx ruff check --isolated --select E4,E7,E9,F .

      - name: Validate pipelines, connections and transforms
        id: validate
        # dev_duckdb needs no credentials; the airflow env only resolves inside Airflow
        run: $CARTAGE validate --env dev_duckdb

      # Cartage's "secret not found" hint points at .cartage/secrets.yaml, which is git-ignored and never
      # reaches CI, so say where the fix actually goes. Fires on any validate failure, not only missing secrets.
      - name: Explain secret failures
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          echo "::notice::A missing CARTAGE_SECRET__* must be added to the env: block of"
          echo "::notice::.github/workflows/12_feature_cartage_checks.yml - secrets.yaml is git-ignored"
          echo "::notice::and never reaches CI. Placeholder values are fine: validate never connects."

      - name: Generated DAGs are up to date
        run: $CARTAGE generate --check
