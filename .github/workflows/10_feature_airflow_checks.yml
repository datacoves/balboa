name: "10: 🎯 Airflow Validations"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - 'release/**/*'
    paths:
      - orchestrate/**/*

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# This cancels a run if another change is pushed to the same branch
concurrency:
  group: orchestrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    name: Validate Branch Names and Merge Rules and assure branch has changes from main

    env:
      SOURCE_BRANCH: ${{ github.head_ref }}
      TARGET_BRANCH: ${{ github.base_ref }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Validate current branch
      run: automate/git/branch_validator.py

  airflow:
    name: Pull Request Airflow Tests
    runs-on: ubuntu-latest
    needs: [validate-branch]

    # Root: the image's default user (airflow) can't write the runner's /__w/_temp, so actions/checkout fails (EACCES).
    container:
      image: datacoves/ci-airflow-dbt-snowflake:6.0
      options: --user root

    env:
      AIRFLOW__CORE__DAGS_FOLDER: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/orchestrate/dags
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 300
      AIRFLOW__ARTIFACTS_PATH: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/orchestrate
      DATACOVES__DBT_HOME: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/transform
      DATACOVES__REPO_PATH_RO: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
      PYTHONPATH: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
      FORCE_COLOR: 1
      OUTPUT_FILE: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/test_output.md

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # The CI image doesn't ship Cosmos (used by other_examples/retry_dbt_failures_cosmos.py). Pinning
      # apache-airflow-core to the image's version keeps pip from changing Airflow. The image has two Pythons, so install
      # with the interpreter pytest runs on (its shebang), via `-m pip`: the image's `pip` wrapper refuses to run as root,
      # and the job runs as root (see container options). That interpreter is the one with the Datacoves provider; plain
      # `python` is a virtualenv without it, so later steps use CI_PYTHON too.
      - name: Install Cosmos
        env:
          PIP_NO_CACHE_DIR: 1   # the image's pip cache dir belongs to the airflow user, and this job runs as root
        run: |
          CI_PYTHON=$(head -n 1 "$(command -v pytest)" | sed 's/^#!//')
          echo "CI_PYTHON=$CI_PYTHON" >> "$GITHUB_ENV"
          echo "pytest runs on: $CI_PYTHON"
          $CI_PYTHON -m pip install --root-user-action=ignore "astronomer-cosmos==1.15.1" "apache-airflow-core==$AIRFLOW_VERSION"
          $CI_PYTHON -c "import cosmos; print('cosmos', cosmos.__version__, 'from', cosmos.__file__)"

      # Reports load times and top-level Variable use; it logs DAG import errors without failing (pytest below does).
      - name: Test DAGs Load time and variable usage at top level
        id: test_load_time_variables
        run: $CI_PYTHON /usr/app/test_dags.py --dag-loadtime-threshold 1 --check-variable-usage --write-output --filename "$OUTPUT_FILE"

      # if write-output is set in the prior step, the following step will run
      - name: Add PR comment of results of test_load_time_variables tests
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: ${{ env.OUTPUT_FILE }}
          header: Test DAGs Load time and variable usage at top level

      - name: Custom Airflow Validation Tests
        env:
          NO_COLOR: 1
        run: pytest $AIRFLOW__ARTIFACTS_PATH/test_dags/validate_dags.py --output-file "$OUTPUT_FILE"


      - name: Add PR comment of results of custom Airflow validation tests
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          # path: formatted_output.md
          path: ${{ env.OUTPUT_FILE }}
          header: Custom Tests
          GITHUB_TOKEN: ${{ github.token }}

  airflow-job-status:
    runs-on: ubuntu-latest
    needs: [validate-branch, airflow]
    if: always()
    steps:
      - name: Comment PR with Airflow status
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ## 🎯 Airflow Workflow Status
            - **Branch Validation**: ${{ needs.validate-branch.result }}
            - **Airflow Validations**: ${{ needs.airflow.result }}

            ${{ needs.validate-branch.result == 'failure' && '❌ _Branch validation failed_' || '' }}
            ${{ needs.airflow.result == 'skipped' && '⏭️ _Airflow validations skipped_' || '' }}
            ${{ needs.airflow.result == 'success' && '✅ _All Airflow validations passed_' || '' }}
            ${{ needs.airflow.result == 'failure' && '❌ _Airflow validations failed_' || '' }}
          header: airflow-workflow-status
