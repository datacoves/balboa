version: 2

models:
  - name: stg_vendors
    description: ERP vendors with deterministic activity-generation drivers.
    columns:
      - name: vendor_id
        description: Vendor primary key.
        data_tests: [not_null, unique]
      - name: vendor_name
        description: Vendor display name.
        data_tests: [not_null]
      - name: category
        description: Vendor spend category.
        data_tests: [not_null]
      - name: status
        description: Recorded lifecycle flag, independent from behavioral activity.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: onboarded_date
        description: First day of the vendor onboarding month.
        data_tests: [not_null]
      - name: activity_bucket
        description: Activity profile controlling PO and invoice recency.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D']
      - name: vendor_seq
        description: Stable sequence used to assign deterministic activity profiles.
        data_tests: [not_null]
      - name: po_active_through_month
        description: Final month in which the vendor can generate purchase orders.
        data_tests: [not_null]
      - name: invoice_po_through_month
        description: Final purchase order month eligible to generate an invoice.
        data_tests: [not_null]
      - name: invoice_lag_months
        description: Whole-month lag between an eligible purchase order and its invoice.
        data_tests: [not_null]
