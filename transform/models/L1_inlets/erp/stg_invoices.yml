version: 2

models:
  - name: stg_invoices
    description: Deterministic ERP invoices, including delayed and missing invoice scenarios.
    columns:
      - name: invoice_id
        description: Invoice primary key.
        data_tests: [not_null, unique]
      - name: po_id
        description: Billed purchase order foreign key.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_purchase_orders')
                field: po_id
      - name: vendor_id
        description: Vendor foreign key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_vendors')
                field: vendor_id
      - name: invoice_date
        description: Invoice activity date.
        data_tests: [not_null]
      - name: invoice_amount
        description: Positive whole-currency invoice amount equal to the PO amount.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: '> 0'
      - name: paid_date
        description: Payment date; null while the invoice remains open.

      - name: invoice_status
        description: Payment state for the invoice.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'open']
